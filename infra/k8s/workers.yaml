# Same image as the API. Two pools so slow, I/O-bound video jobs never starve image jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-general
  labels: { app: worker-general, tier: worker }
spec:
  replicas: 3
  selector: { matchLabels: { app: worker-general } }
  template:
    metadata:
      labels: { app: worker-general, tier: worker }
    spec:
      # Long enough for in-flight generations to finish; BullMQ re-queues stalled jobs otherwise.
      terminationGracePeriodSeconds: 180
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/valeriymakushkin-png/mascot-api
          args: ["node", "dist/worker.js"]
          ports: [{ name: metrics, containerPort: 4001 }]
          env:
            - { name: WORKER_QUEUES, value: "avatar,sticker,meme,pfp,telegram,notify,maintenance" }
            - { name: WORKER_CONCURRENCY_AVATAR, value: "4" }
            - { name: WORKER_CONCURRENCY_STICKER, value: "4" }
            - { name: SHARP_CONCURRENCY, value: "2" }
          envFrom:
            - configMapRef: { name: mascot-config }
            - secretRef: { name: mascot-secrets }
          resources:
            requests: { cpu: "1", memory: 1536Mi }
            limits: { memory: 3Gi }
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 20
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 2Gi } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-video
  labels: { app: worker-video, tier: worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker-video } }
  template:
    metadata:
      labels: { app: worker-video, tier: worker }
    spec:
      terminationGracePeriodSeconds: 600
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/valeriymakushkin-png/mascot-api
          args: ["node", "dist/worker.js"]
          ports: [{ name: metrics, containerPort: 4001 }]
          env:
            - { name: WORKER_QUEUES, value: "video" }
            - { name: WORKER_CONCURRENCY_VIDEO, value: "12" }
          envFrom:
            - configMapRef: { name: mascot-config }
            - secretRef: { name: mascot-secrets }
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { memory: 2Gi }
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 20
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 4Gi } }]
