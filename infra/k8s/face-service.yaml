apiVersion: apps/v1
kind: Deployment
metadata:
  name: face-service
  labels: { app: face-service, tier: ml }
spec:
  replicas: 2
  selector: { matchLabels: { app: face-service } }
  template:
    metadata:
      labels: { app: face-service, tier: ml }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: face
          image: ghcr.io/valeriymakushkin-png/mascot-face
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: FACE_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: mascot-secrets, key: FACE_SERVICE_TOKEN } }
            - { name: MAX_CONCURRENT_INFERENCES, value: "2" }
            - { name: INSIGHTFACE_ROOT, value: /models/insightface }
          resources:
            requests: { cpu: "2", memory: 3Gi }
            limits: { memory: 4Gi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: face-service
  labels: { app: face-service }
spec:
  selector: { app: face-service }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: face-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: face-service }
  minReplicas: 2
  maxReplicas: 16
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
