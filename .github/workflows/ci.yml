name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck · unit tests · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: mascot, POSTGRES_PASSWORD: mascot, POSTGRES_DB: mascot }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mascot" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mascot:mascot@localhost:5432/mascot?schema=public
      DIRECT_DATABASE_URL: postgresql://mascot:mascot@localhost:5432/mascot?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-0123456789abcdefghijklmnop
      DEV_AUTH_ENABLED: "true"
      TELEGRAM_BOT_TOKEN: "000000:dev-token"
      TELEGRAM_WEBHOOK_SECRET: dev-webhook-secret
      TELEGRAM_API_BASE: http://localhost:4099
      STORAGE_DRIVER: local
      # SVG mock renders keep the e2e fast and deterministic; the 3D path is exercised locally.
      MOCK_IMAGE_RENDERER: svg
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: System packages (ffmpeg, fonts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mascot/shared build && pnpm --filter @mascot/mascot-3d build
      - name: Database migrations
        run: pnpm --filter @mascot/api exec prisma migrate deploy
      - name: Typecheck
        run: pnpm -r --filter "./apps/*" --filter "./packages/*" typecheck
      - name: Translations
        run: pnpm --filter @mascot/web i18n:check
      - name: Unit tests
        run: pnpm --filter @mascot/api test -- --ci
      - name: Build
        run: pnpm -r --filter "./apps/*" build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_BOT_USERNAME: MascotAIBot
      - name: End-to-end smoke (API + workers, mock AI, mock Telegram)
        working-directory: apps/api
        run: |
          node dist/main.js > api.log 2>&1 &
          node dist/worker.js > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/health/ready && break; sleep 1; done
          pnpm test:e2e
      - name: Logs on failure
        if: failure()
        working-directory: apps/api
        run: tail -n 200 api.log worker.log || true

  face-service:
    name: Face service tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/face-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 pydantic==2.11.4 pydantic-settings==2.9.1 pytest
      - run: python -m pytest -q tests

  images:
    name: Build & push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [node, face-service]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: mascot-api, context: ., dockerfile: apps/api/Dockerfile }
          - { name: mascot-web, context: ., dockerfile: apps/web/Dockerfile }
          - { name: mascot-admin, context: ., dockerfile: apps/admin/Dockerfile }
          - { name: mascot-face, context: apps/face-service, dockerfile: apps/face-service/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
