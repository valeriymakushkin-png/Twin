# Local full stack. Infra only:   docker compose up -d postgres redis minio minio-init
# Everything:                     docker compose --profile app up -d --build
name: mascot-ai

x-api-env: &api-env
  NODE_ENV: development
  DATABASE_URL: postgresql://mascot:mascot@postgres:5432/mascot?schema=public
  DIRECT_DATABASE_URL: postgresql://mascot:mascot@postgres:5432/mascot?schema=public
  REDIS_URL: redis://redis:6379
  PUBLIC_API_URL: http://localhost:4000
  WEB_APP_URL: http://localhost:3000
  ADMIN_APP_URL: http://localhost:3001
  JWT_SECRET: local-dev-secret-change-me-1234567890
  DEV_AUTH_ENABLED: "true"
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY_ID: minio
  S3_SECRET_ACCESS_KEY: minio-secret
  S3_PRIVATE_BUCKET: mascot-private
  S3_PUBLIC_BUCKET: mascot-public
  PUBLIC_CDN_URL: http://localhost:9000/mascot-public
  FACE_ANALYSIS_PROVIDER: service
  FACE_SERVICE_URL: http://face-service:8000
  FACE_SERVICE_TOKEN: dev-face-token
  BACKGROUND_REMOVAL: face-service
  AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER:-mock}
  AI_VIDEO_PROVIDER: ${AI_VIDEO_PROVIDER:-mock}
  VISION_PROVIDER: ${VISION_PROVIDER:-mock}
  TTS_PROVIDER: ${TTS_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  BFL_API_KEY: ${BFL_API_KEY:-}
  KLING_ACCESS_KEY: ${KLING_ACCESS_KEY:-}
  KLING_SECRET_KEY: ${KLING_SECRET_KEY:-}
  RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-000000:dev-token}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-MascotAIBot}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-dev-webhook-secret}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mascot
      POSTGRES_PASSWORD: mascot
      POSTGRES_DB: mascot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mascot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction; AOF so queued jobs survive restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes: ["./infra/minio:/init:ro"]

  face-service:
    profiles: ["app"]
    build: ./apps/face-service
    environment:
      FACE_SERVICE_TOKEN: dev-face-token
    ports: ["8000:8000"]

  migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *api-env
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  worker:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-MascotAIBot}
    ports: ["3000:3000"]

  admin:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-MascotAIBot}
    ports: ["3001:3001"]

volumes:
  pgdata:
  redisdata:
  miniodata:
